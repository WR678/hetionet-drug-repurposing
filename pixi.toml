# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "hetionet-drug-repurposing"
description = "Lightweight, CPU-only drug repurposing on the Hetionet knowledge graph with a small R-GCN and a simple baseline"
authors = ["Rui Wang <Wang.Rui@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)
pytorch = ">=2.14.1,<3"
pytorch_geometric = ">=2.8.1,<3"
scikit-learn = ">=1.9.1,<2"

[tasks]
check = { cmd = "python --version && quarto --version && python -c \"import torch, torch_geometric, sklearn; print('torch', torch.__version__, '| torch_geometric', torch_geometric.__version__, '| scikit-learn', sklearn.__version__)\"", description = "Check that the tools work" }
download = { cmd = "python scripts/download_data.py", description = "Download Hetionet and verify its checksums" }
# `reproduce` must rebuild every result from the raw data with one command.
# For now it downloads the data and checks the tools; analysis steps follow.
reproduce = [{ task = "download" }, { task = "check" }]
