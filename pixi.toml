# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "hetionet-drug-repurposing"
description = "Lightweight, CPU-only drug repurposing on the Hetionet knowledge graph with a small R-GCN and a simple baseline"
authors = ["Rui Wang <Wang.Rui@mbzuai.ac.ae>"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
quarto = ">=1.9"
jupyterlab = ">=4"
ipykernel = ">=7"
pandas = ">=2"
matplotlib = ">=3.9"
papermill = ">=2.6"   # Quarto needs it for report parameters (-P)
pytorch = ">=2.14.1,<3"
pytorch_geometric = ">=2.8.1,<3"
scikit-learn = ">=1.9.1,<2"

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
# `reproduce` must rebuild every result from the raw data with one command.
# The lessons replace this placeholder with real steps.
reproduce = { cmd = "python -c \"print('Nothing to reproduce yet: add your steps to the reproduce task in pixi.toml')\"", description = "Rebuild all results from raw data" }
